name: WakaTime Development Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-readme:
    name: Update Development Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate GitHub PAT
        env:
          GH_TOKEN: ${{ secrets.WAKA_GITHUB_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WAKA_GITHUB_PAT is missing"
            exit 1
          fi

          echo "Checking GitHub authentication..."
          gh api user --jq '.login'

      - name: Generate WakaTime Stats
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.WAKA_GITHUB_PAT }}

          SECTION_NAME: "waka"
          LOCALE: "en"

          SHOW_OS: "True"
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_TIMEZONE: "True"
          SHOW_TOTAL_CODE_TIME: "True"

          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_UPDATED_DATE: "True"

          BAR_STYLE: "svg"
          BAR_COLOR: "#2F81F7"
          BAR_TRACK_COLOR: "#21262D"
          BAR_RADIUS: "4"

          DEBUG_LOGGING: "False"